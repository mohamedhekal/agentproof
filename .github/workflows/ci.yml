name: ci
on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository. It uses no secrets and needs no API key
# (the recorded model runs are replayed offline from committed cassettes).
permissions:
  contents: read

jobs:
  hygiene:
    name: secrets and private-file check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs (the comment is the tag they were resolved from on 2026-11-07).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: No secrets, personal data or private files in the tree
        run: python scripts/check_secrets.py

  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Unit tests
        run: pytest -q
      - name: Reliability gate (hardened agent vs baseline)
        run: agentproof gate --agent hardened --baseline baseline.json
      - name: Replay the recorded Claude run (offline, no API key)
        run: agentproof compare --agents replay:cassettes/claude.jsonl --runs 5 --chaos 0.3
      - name: Head-to-head report
        run: |
          agentproof compare --out reports
          cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
