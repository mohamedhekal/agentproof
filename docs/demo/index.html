<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentProof: live demo</title>
<meta name="description" content="A demo that explains the idea: chaos testing, state-based grading and replay for AI agents. Runs entirely in your browser.">
<!-- Everything runs in your browser. Only your own files and the pinned Pyodide runtime are loaded; no server code, no API keys, no tracking. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self' https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">&#128737;</span> <b>AgentProof</b> <span class="tag" data-i18n="liveDemo">live demo</span></div>
  <nav>
    <a href="https://github.com/mohamedhekal/agentproof" data-i18n="navRepo">Repository</a>
    <a href="https://github.com/mohamedhekal/agentproof/wiki" data-i18n="navWiki">Wiki</a>
    <button id="lang" class="ghost" type="button" aria-label="Language">العربية</button>
  </nav>
</header>

<main>
  <div class="banner" role="note">
    <b data-i18n="bannerTitle"></b>
    <span data-i18n="bannerText"></span>
  </div>

  <section class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroText"></p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>

  <section id="lab" class="card">
    <h2 data-i18n="labTitle"></h2>
    <p class="muted" data-i18n="labIntro"></p>
    <div class="controls">
      <label><span data-i18n="chaosLabel"></span> <output id="chaosOut">0.30</output>
        <input id="chaos" type="range" min="0" max="0.5" step="0.05" value="0.3" aria-describedby="chaosHelp"></label>
      <label><span data-i18n="runsLabel"></span>
        <select id="runs"><option>5</option><option>10</option><option selected>20</option></select></label>
      <label><span data-i18n="seedLabel"></span>
        <input id="seed" type="number" min="0" max="9999" value="0"></label>
      <fieldset class="agents"><legend data-i18n="agentsLabel"></legend>
        <label><input type="checkbox" value="naive" checked> naive</label>
        <label><input type="checkbox" value="hardened" checked> hardened</label>
        <label><input type="checkbox" value="hardened-no-retry"> hardened, retries off</label>
      </fieldset>
      <button id="run" class="primary" type="button" disabled data-i18n="runBtn"></button>
    </div>
    <p id="chaosHelp" class="muted small" data-i18n="chaosHelp"></p>
    <div id="results" aria-live="polite"></div>
  </section>

  <section id="explorer" class="card" hidden>
    <h2 data-i18n="explTitle"></h2>
    <p class="muted" data-i18n="explIntro"></p>
    <div class="controls">
      <label><span data-i18n="filterAgent"></span> <select id="fAgent"></select></label>
      <label><span data-i18n="filterStatus"></span>
        <select id="fStatus"><option value="all" data-i18n="all"></option><option value="unsafe">unsafe</option><option value="safe_fail">safe_fail</option></select></label>
    </div>
    <div class="split">
      <ul id="failList" class="list" role="listbox" aria-label="Failing runs"></ul>
      <div id="traceView" class="trace" aria-live="polite"></div>
    </div>
  </section>

  <section id="claude" class="card">
    <h2 data-i18n="claudeTitle"></h2>
    <p class="muted" data-i18n="claudeIntro"></p>
    <button id="claudeBtn" type="button" disabled data-i18n="claudeBtn"></button>
    <div id="claudeOut"></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2 data-i18n="brainTitle"></h2>
      <p class="muted" data-i18n="brainIntro"></p>
      <button id="brainBtn" type="button" disabled data-i18n="brainBtn"></button>
      <div id="brainOut"></div>
    </div>
    <div class="card">
      <h2 data-i18n="autoTitle"></h2>
      <p class="muted" data-i18n="autoIntro"></p>
      <button id="autoBtn" type="button" disabled data-i18n="autoBtn"></button>
      <div id="autoOut"></div>
    </div>
  </section>

  <section class="card limits">
    <h2 data-i18n="limitsTitle"></h2>
    <ul id="limitsList"></ul>
    <p><span data-i18n="runIt"></span> <code>pip install -e . &amp;&amp; agentproof compare</code></p>
  </section>
</main>

<footer>
  <span>MIT</span> &middot;
  <a href="https://github.com/mohamedhekal/agentproof">github.com/mohamedhekal/agentproof</a> &middot;
  <a href="https://github.com/mohamedhekal/agentproof/blob/main/docs/pitch/AgentProof-pitch-deck.pdf" data-i18n="navDeck">Pitch deck (PDF)</a> &middot;
  <span data-i18n="synthetic">All data is synthetic.</span>
</footer>
</body>
</html>
