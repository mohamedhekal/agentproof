[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentproof"
version = "0.1.0"
description = "Prove your agent survives production, not just the demo: chaos, replay, reliability gates and calibrated human-in-the-loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
